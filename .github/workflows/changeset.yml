name: changeset

on:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: changeset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version changes
      pull-requests: write # create version PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: false

      - id: select-mode
        uses: changesets/action/select-mode@v2

      - if: steps.select-mode.outputs.mode == 'version'
        uses: changesets/action/version@v2
        with:
          script: pnpm changeset version
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
